name: Verify and deploy Pages

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No ambient write token. PR code runs only in the read-only build job.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify compatibility and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install canonical scientific validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Check target19 candidate state before expensive validation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PYCODE'
          import importlib.util, json, os
          spec=importlib.util.spec_from_file_location('target19','scripts/publish-target19.py')
          target19=importlib.util.module_from_spec(spec);spec.loader.exec_module(target19)
          cfg=json.load(open('build/publication-target19.json'))
          target19.validate_config(cfg,draft=os.environ['GITHUB_EVENT_NAME']=='pull_request')
          PYCODE
      - name: Verify target19 integration and exact projection contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          node --test tests/target19-otfs-integration.test.cjs tests/target19-nearfield-integration.test.cjs tests/target19-bistatic-integration.test.cjs tests/target19-otfs-alias.test.cjs tests/target19-layout.test.cjs tests/target19-pages-security.test.cjs
          python tests/test-target19-publication.py
      - name: Verify and reconstruct chunked evidence
        run: |
          node --test tests/chunked-evidence.test.cjs
          node scripts/restore-chunked-evidence.cjs
      - name: Test source-only dependency preservation and the compatibility builder
        run: |
          node --test --test-concurrency=1 tests/recovery-baseline-projection.test.cjs
          node --test tests/lesson-narrow-layout-source-gate.test.cjs tests/pilot-sticky-layout-source-gate.test.cjs tests/perceptive-sticky-layout.test.cjs tests/desktop-layout-integration.test.cjs tests/lesson-narrow-layout-integration.test.cjs tests/dual-array-dependencies.test.cjs tests/otfs-diagnostics-integration.test.cjs tests/otfs-portability-integration.test.cjs tests/perceptive-bsbl-responsive.test.cjs tests/perceptive-bsbl-responsive-integration.test.cjs tests/pilot-pattern-dependencies.test.cjs tests/perceptive-bsbl-dependencies.test.cjs tests/sensing-assisted-otfs-dependencies.test.cjs tests/nearfield-multitarget-dependencies.test.cjs tests/cellfree-maprt-dependencies.test.cjs
          node --test tests/build-fixture-lifetime.test.cjs tests/dual-array-browser-timers-current.test.cjs tests/dual-array-plot-readability-current.test.cjs tests/dual-array-current-runtime.test.cjs tests/dual-array-browser-integration.test.cjs
          node --max-old-space-size=512 --test --test-concurrency=1 tests/dual-array-record-portability.test.cjs tests/dual-array-record-portability-integration.test.cjs
          node --test tests/cooperative-clusters-build.test.cjs
          node --test tests/cooperative-load-build.test.cjs
          node --test tests/causal-capacity-build.test.cjs
          node --test tests/multipath-information-build.test.cjs
          node --test tests/compatibility-build.test.cjs
      - name: Run full legacy tests and independently reproduce the public artifact
        run: |
          # Preserve the full child-test failure report; Node's uncaught-error
          # printer can truncate a large exception when stderr is a CI pipe.
          node -e '
            try {
              process.argv[1] = require.resolve("./scripts/build-compatibility.cjs");
              require("./scripts/build-compatibility.cjs");
            } catch (error) {
              process.exitCode = 1;
              process.stderr.write(String(error?.stack ?? error) + "\n");
            }
          ' -- scripts/build-compatibility.cjs --test --reproducible
      - name: Recheck exact output and unchanged tracked sources
        run: |
          node scripts/build-compatibility.cjs --check
          git diff --exit-code
      - name: Project and independently compare exact target19 artifact
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          draft=''
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then draft='--local-draft'; fi
          python scripts/publish-target19.py --input dist --output published $draft
          python scripts/publish-target19.py --input dist --output published-recheck $draft
          python - <<'PYCODE'
          import hashlib, pathlib
          def inventory(directory):
              root=pathlib.Path(directory)
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          first,second=inventory('published'),inventory('published-recheck')
          if not first or first!=second: raise SystemExit('Target19 projection is not byte-reproducible')
          PYCODE
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: published
          name: github-pages
          retention-days: 7
          # Preserve the manifest's .nojekyll; the builder rejects unexpected files.
          include-hidden-files: true

  deploy:
    name: Deploy verified main artifact
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Never check out or execute repository scripts with deployment privileges.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
